  /* 특가 요약표: 특가율 배지 */

<script>
  const FAVS_KEY = 'fd_favs';
  const DAY_VALUE_KEY = 'fd_day_value';
  const DAY_VALUE_DEFAULT = 10;
  const MAX_LEAVE_KEY = 'fd_max_leave';
  const MAX_LEAVE_DEFAULT = 5;
  const cacheBust = `?t=${Date.now()}`;

  const state = {
    routesStatus: [],
    matrix: null,
    holidayWindows: [],
    dayValue: (function () {
      try {
        const v = parseInt(localStorage.getItem(DAY_VALUE_KEY), 10);
        return isNaN(v) || v < 0 ? DAY_VALUE_DEFAULT : v;
      } catch (e) { return DAY_VALUE_DEFAULT; }
    })(),
    maxLeave: (function () {
      try {
        const raw = localStorage.getItem(MAX_LEAVE_KEY);
        if (raw === '') return null;
        const v = parseInt(raw, 10);
        return isNaN(v) || v < 0 ? MAX_LEAVE_DEFAULT : v;
      } catch (e) { return MAX_LEAVE_DEFAULT; }
    })()
  };
  let holidaySet = new Set();

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function fmt(n) { return n == null ? '-' : Number(n).toLocaleString('ko-KR'); }
  function rk(r) { return r.id || (r.origin + '-' + r.destination); }
  function routeGroupKey(r) { return r.origin + '-' + r.destination; }
  // 인덱스 페이지(destHolFavKey)와 같은 규칙: "<origin-destination>::<windowId>"
  function destHolFavKey(gk, winId) { return gk + '::' + winId; }
  function emptyRow(colspan, msg) {
    return `<tr class="empty-row"><td colspan="${colspan}">${esc(msg)}</td></tr>`;
  }
  function getFavs() {
    try { return new Set(JSON.parse(localStorage.getItem(FAVS_KEY) || '[]')); }
    catch (e) { return new Set(); }
  }
  function setFavs(set) { try { localStorage.setItem(FAVS_KEY, JSON.stringify([...set])); } catch (e) {} }

  async function fetchJson(path, fallback) {
    try {
      const res = await fetch(path + cacheBust);
      if (!res.ok) return fallback;
      return await res.json();
    } catch (e) { return fallback; }
  }

  const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
  function weekdayOf(dateStr) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr == null ? '' : dateStr));
    if (!m) return '';
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    if (isNaN(d.getTime())) return '';
    return WEEKDAYS[d.getDay()];
  }
  function fmtDateYY(dateStr, wd) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr == null ? '' : dateStr));
    if (!m) return esc(dateStr == null ? '' : dateStr);
    const w = wd || weekdayOf(dateStr);
    return `${m[1].slice(2)}-${m[2]}-${m[3]} (${esc(w)})`;
  }
  function stopsCell(stops, airline) {
    const air = (airline == null ? '' : String(airline)).trim();
    const airSub = air ? `<span class="cell-sub">${esc(air)}</span>` : '';
    if (stops === '' || stops == null) {
      return air ? '<span class="cell-sub">—</span>' + airSub : '<span class="cell-sub">—</span>';
    }
    const n = parseInt(stops, 10);
    if (isNaN(n)) return '<span class="cell-sub">—</span>' + airSub;
    const badge = n === 0
      ? '<span class="stops-direct">직항</span>'
      : `<span class="stops-via">경유${n}</span>`;
    return badge + airSub;
  }
  function tripStrip(departStr, returnStr) {
    const md = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(departStr || ''));
    const mr = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(returnStr || ''));
    if (!md || !mr) return '';
    let cur = new Date(Number(md[1]), Number(md[2]) - 1, Number(md[3]));
    const end = new Date(Number(mr[1]), Number(mr[2]) - 1, Number(mr[3]));
    if (isNaN(cur.getTime()) || isNaN(end.getTime()) || end < cur) return '';
    let cells = '', guard = 0;
    while (cur <= end && guard < 40) {
      const y = cur.getFullYear(), mo = cur.getMonth() + 1, da = cur.getDate();
      const iso = `${y}-${String(mo).padStart(2, '0')}-${String(da).padStart(2, '0')}`;
      const dow = cur.getDay();
      let cls = 'wd', kind = '평일';
      if (holidaySet.has(iso)) { cls = 'hol'; kind = '공휴일'; }
      else if (dow === 0 || dow === 6) { cls = 'wknd'; kind = dow === 0 ? '일요일' : '토요일'; }
      cells += `<span class="tstrip-day ${cls}" title="${esc(iso)} ${kind}"></span>`;
      cur.setDate(cur.getDate() + 1);
      guard++;
    }
    return `<span class="tstrip" title="공휴일(빨강)·주말(파랑)·평일(회색)">${cells}</span>`;
  }
  function climateBadge(iata, departDateStr) {
    if (!window.climateFor) return '';
    const m = /^\d{4}-(\d{2})/.exec(String(departDateStr || ''));
    if (!m) return '';
    const month = parseInt(m[1], 10);
    const c = window.climateFor(iata, month);
    if (!c) return '';
    const rain = c.rain === '우기' ? '🌧 우기' : c.rain === '건기' ? '☀️ 건기' : '⛅ 보통';
    const title = `${month}월 평균 기후 · ${rain} · 낮 최고 ${c.temp}°C · 습도 ${c.humidity}%`;
    return `<span class="cell-sub" title="${esc(title)}">${rain} · ${c.temp}°C · 습도 ${c.humidity}%</span>`;
  }

  // ===================== 휴일 가치 반영 추천 (index.html과 동일 로직) =====================
  function dayValueWon() { return (state.dayValue || 0) * 10000; }
  function cellPairs(cell) {
    if (Array.isArray(cell.pairs) && cell.pairs.length) return cell.pairs;
    return cell.best ? [{ ...cell.best, price: cell.min_price }] : [];
  }
  function effCost(p) { return p.price - dayValueWon() * (p.bonus_days || 0); }
  function leaveCap() { return state.maxLeave == null ? Infinity : state.maxLeave; }
  function eligiblePairs(cell) {
    const ps = cellPairs(cell);
    const cap = leaveCap();
    if (cap === Infinity) return ps;
    return ps.filter(p => (p.leave_days || 0) <= cap);
  }
  function pickPair(cell) {
    const ps = eligiblePairs(cell);
    if (!ps.length) return null;
    let best = ps[0];
    for (const p of ps) if (effCost(p) < effCost(best)) best = p;
    return best;
  }
  function schedText(b) {
    return `${b.nights}박 ${b.days}일 (연차 ${b.leave_days}개 소모)`;
  }
  function primaryPair(cell) {
    return cellPairs(cell)[0] || cell.best;
  }
  // index.html과 같은 규칙: 최저가 일정이 연차 상한을 넘으면 상한 안에서 실질비용이
  // 가장 낮은 일정으로 대표 자리를 통째로 바꿔친다 (상한 초과 일정을 대표로 보여주지 않음).
  function displayPair(cell) {
    const min = primaryPair(cell);
    const cap = leaveCap();
    if (!min || cap === Infinity || (min.leave_days || 0) <= cap) return min;
    return pickPair(cell) || min;
  }
  function recommendedAltNote(cell) {
    const min = primaryPair(cell);
    const rec = pickPair(cell);
    if (min && !rec) {
      return `<div class="cell-sub eff-note" title="이 연휴에서 찾은 일정은 모두 설정한 연차 상한(${leaveCap()}개)을 넘습니다 — 상한을 늘리면 후보가 보입니다">⚠ 연차 ${min.leave_days}개 필요 (상한 ${leaveCap()}개 초과)</div>`;
    }
    if (!min || !rec || rec === min || rec.depart_date === min.depart_date && rec.return_date === min.return_date) return '';
    const diff = rec.price - min.price;
    const dBonus = (rec.bonus_days || 0) - (min.bonus_days || 0);
    const dLeave = (rec.leave_days || 0) - (min.leave_days || 0);
    const period = `${fmtDateYY(rec.depart_date, rec.depart_weekday)} ~ ${fmtDateYY(rec.return_date, rec.return_weekday)}`;
    const capped = (min.leave_days || 0) > leaveCap();
    const title = capped
      ? `최저가 일정(${fmt(min.price)}원)은 연차 ${min.leave_days}개가 필요해 상한(${leaveCap()}개)을 넘습니다. `
        + `연차 ${rec.leave_days}개로 갈 수 있는 일정 중 실질 부담이 가장 낮은 것입니다`
      : `최저가 일정(${fmt(min.price)}원, ${min.depart_date}~${min.return_date})보다 ${fmt(diff)}원 비싸지만 `
        + `덤 휴일이 ${dBonus}일 더 많아, 휴일 하루 ${fmt(dayValueWon())}원 기준 실질 부담이 더 낮은 일정입니다`
        + (dLeave > 0 ? ` (연차는 ${dLeave}개 더 씁니다)` : '');
    const priceHtml = rec.booking_url
      ? `<a class="price-link" href="${esc(rec.booking_url)}" target="_blank" rel="noopener">${fmt(rec.price)}원</a>`
      : `${fmt(rec.price)}원`;
    const delta = capped
      ? `연차 ${min.leave_days}→${rec.leave_days}개`
      : `+${fmt(diff)} · 휴일 +${dBonus}일${dLeave > 0 ? ` · 연차 +${dLeave}개` : ''}`;
    return `<div class="cell-sub eff-note" title="${esc(title)}">💡 대신 추천: ${esc(period)} · ${schedText(rec)} · ${priceHtml} (${delta})</div>`;
  }
  function gvDealVal(cell) {
    return (cell && cell.tier !== 'C' && cell.deal_pct != null) ? cell.deal_pct : null;
  }
  function gvDealBadge(cell, price) {
    if (!cell) return '<span class="gv-badge gv-na">수집 대기</span>';
    if (cell.tier === 'C') {
      return `<span class="gv-badge gv-na" title="이 연휴의 통상 시세를 잡을 표본이 아직 부족합니다 (관측 ${cell.n_obs || 0}) — 최저가만 참고하세요">수집 중</span>`;
    }
    const p = price != null ? price : cell.min_price;
    const d = cell.typical > 0 ? Math.max(0, Math.round((cell.typical - p) / cell.typical * 100)) : (cell.deal_pct || 0);
    const cls = d >= 12 ? 'gv-r0' : d >= 5 ? 'gv-r1' : 'gv-na';
    const txt = d >= 5 ? `−${d.toFixed(0)}%` : '수준';
    const dim = cell.tier === 'B' ? ' style="opacity:.65"' : '';
    let title = `이 연휴 통상 시세 약 ${fmt(cell.typical)}원 · 현재가 ${fmt(p)}원`
      + ` (통상가 대비 −${d.toFixed(0)}%) · 관측 ${cell.n_obs}건`;
    if (cell.tier === 'B') title += '\n※ 표본이 적어 참고용입니다';
    return `<span class="gv-badge ${cls}"${dim} title="${esc(title)}">${esc(txt)}</span>`;
  }
  const gvTierRank = t => ({ A: 0, B: 1, C: 2 }[t] != null ? { A: 0, B: 1, C: 2 }[t] : 3);
  function cellBetter(c, best) {
    if (!best) return true;
    const a = [gvTierRank(c.tier), -(gvDealVal(c) == null ? -1 : gvDealVal(c)), c.min_price];
    const b = [gvTierRank(best.tier), -(gvDealVal(best) == null ? -1 : gvDealVal(best)), best.min_price];
    return a[0] < b[0] || (a[0] === b[0] && (a[1] < b[1] || (a[1] === b[1] && a[2] < b[2])));
  }

  function gvWindows() {
    if (state.matrix && Array.isArray(state.matrix.windows) && state.matrix.windows.length) {
      return state.matrix.windows;
    }
    return state.holidayWindows || [];
  }
  function windowLabel(id) {
    const w = gvWindows().find(x => x.id === id);
    const m = /^\d{4}-(\d{2})-(\d{2})/.exec(id) || null;
    const dateTxt = m ? `${parseInt(m[1], 10)}/${parseInt(m[2], 10)} ` : '';
    return dateTxt + (w ? (w.label || '') : id);
  }

  // 즐겨찾기 키 하나(gk::winId) -> 화면에 필요한 값 묶음. 그룹 안 모니터가 여럿이면
  // (직항 전용 + 경유 허용) index.html의 destWindowCells와 같은 기준으로 대표 칸을 고른다.
  function resolveFav(key) {
    const idx = key.indexOf('::');
    if (idx < 0) return { key, gk: key, winId: '', missing: true };
    const gk = key.slice(0, idx);
    const winId = key.slice(idx + 2);
    const monitors = state.routesStatus.filter(r => routeGroupKey(r) === gk);
    if (!monitors.length) return { key, gk, winId, missing: true };
    const cells = (state.matrix && state.matrix.cells) || {};
    let best = null, mon = null;
    for (const m of monitors) {
      const c = (cells[winId] || {})[rk(m)];
      if (!c) continue;
      if (!best || c.min_price < best.min_price || (c.min_price === best.min_price && cellBetter(c, best))) {
        best = c; mon = m;
      }
    }
    return { key, gk, winId, route: monitors[0], cell: best, mon, missing: !best };
  }

  function rowHtml(r) {
    const label = r.route ? (r.route.label || (r.route.origin + ' → ' + r.route.destination)) : r.gk;
    const winLabel = windowLabel(r.winId);
    if (r.missing) {
      const reason = r.route
        ? '이 연휴는 아직 시세 데이터가 없습니다 — 다음 자동 수집에서 채워집니다.'
        : '노선 정보를 찾을 수 없습니다 (삭제된 노선일 수 있습니다).';
      return `<tr>
        <td class="c-fav" style="text-align:center"><button class="fav-btn on" data-fav="${esc(r.key)}" title="즐겨찾기에서 빼기">★</button></td>
        <td class="c-name" title="${esc(label)}">${esc(label)}</td>
        <td class="win-name" data-label="연휴">${esc(winLabel)}</td>
        <td colspan="4" class="gv-reason">${esc(reason)}</td>
      </tr>`;
    }
    const b = displayPair(r.cell);
    const capSwapped = b !== primaryPair(r.cell);
    const period = `${fmtDateYY(b.depart_date, b.depart_weekday)} ~ ${fmtDateYY(b.return_date, b.return_weekday)}`;
    const sched = `${period} · ${schedText(b)}${capSwapped ? '' : recommendedAltNote(r.cell)}`;
    const strip = `<span class="gv-strip-row">${tripStrip(b.depart_date, b.return_date)}${climateBadge(r.route.destination, b.depart_date)}</span>`;
    return `<tr>
      <td class="c-fav" style="text-align:center"><button class="fav-btn on" data-fav="${esc(r.key)}" title="즐겨찾기에서 빼기">★</button></td>
      <td class="c-name" title="${esc(label)}">${esc(label)}</td>
      <td class="win-name" data-label="연휴">${esc(winLabel)}</td>
      <td class="num c-price" data-label="최저가"><a class="price-link" href="${esc(b.booking_url)}" target="_blank" rel="noopener" title="예약 페이지로 이동 (최저가 일정)">${fmt(b.price)}</a></td>
      <td class="c-deal" data-label="특가율">${gvDealBadge(r.cell, b.price)}</td>
      <td class="period-cell" data-label="추천 일정">${sched}${strip}</td>
      <td class="c-stops" data-label="직항/경유">${stopsCell(b.stops, b.airline)}</td>
    </tr>`;
  }

  function render() {
    const tbody = document.getElementById('fav-board');
    const keys = [...getFavs()];
    const countEl = document.getElementById('fav-count');
    if (!keys.length) {
      countEl.textContent = '';
      tbody.innerHTML = emptyRow(7, '즐겨찾기한 항목이 없습니다. 노선별 특가 현황에서 연휴 행의 ★를 눌러 담아보세요.');
      return;
    }
    const rows = keys.map(resolveFav);
    rows.sort((a, b) => {
      const an = a.route ? (a.route.label || a.gk) : a.gk;
      const bn = b.route ? (b.route.label || b.gk) : b.gk;
      return an.localeCompare(bn, 'ko') || String(a.winId).localeCompare(String(b.winId));
    });
    countEl.textContent = `(${rows.length}개)`;
    tbody.innerHTML = rows.map(rowHtml).join('');
  }

  document.addEventListener('click', e => {
    const favBtn = e.target.closest('[data-fav]');
    if (!favBtn) return;
    const key = favBtn.getAttribute('data-fav');
    const favs = getFavs();
    favs.delete(key);
    setFavs(favs);
    render();
  });

  async function init() {
    const [routesStatus, holidays, matrix] = await Promise.all([
      fetchJson('data/routes_status.json', []),
      fetchJson('data/holidays.json', []),
      fetchJson('data/matrix.json', null)
    ]);
    state.routesStatus = Array.isArray(routesStatus) ? routesStatus : [];
    if (Array.isArray(holidays)) {
      holidaySet = new Set(holidays);
      state.holidayWindows = [];
    } else if (holidays && typeof holidays === 'object') {
      holidaySet = new Set(Array.isArray(holidays.holidays) ? holidays.holidays : []);
      state.holidayWindows = Array.isArray(holidays.windows) ? holidays.windows : [];
    }
    state.matrix = (matrix && typeof matrix === 'object' && !Array.isArray(matrix)) ? matrix : null;
    render();
  }
  init();
</script>
</body>
</html>
