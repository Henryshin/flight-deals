<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>가짜 에디터 본문</title>
<style>
  body { margin: 0; padding: 20px; font: 15px system-ui, sans-serif; }
  .toolbar { display: flex; gap: 8px; padding: 10px 0; border-bottom: 1px solid #ddd; }
  .toolbar button { padding: 8px 14px; cursor: pointer; }
  .actions { position: fixed; top: 10px; right: 16px; display: flex; gap: 8px; }
  .actions button { padding: 8px 18px; cursor: pointer; }
  .se-documentTitle { padding: 18px 0; border-bottom: 1px solid #eee; font-size: 26px; }
  .se-content { padding-top: 18px; }
  [contenteditable] { outline: none; min-height: 1.4em; }
  .se-component-content { min-height: 320px; }
  .se-image { display: block; max-width: 420px; margin: 14px 0; border: 1px solid #ddd; }
  .se-popup { position: fixed; inset: 0; background: rgba(0,0,0,.45);
              display: flex; align-items: center; justify-content: center; }
  .se-popup-box { background: #fff; padding: 26px; border-radius: 10px; }
  .se-popup-box button { margin-top: 14px; margin-right: 8px; padding: 7px 16px; }
</style>

<div class="se-popup" id="popup">
  <div class="se-popup-box">
    <p>이전에 작성 중인 글이 있습니다. 이어서 쓰시겠어요?</p>
    <button class="se-popup-button-cancel" onclick="closePopup()">취소</button>
    <button onclick="closePopup()">이어쓰기</button>
  </div>
</div>

<div class="actions">
  <button id="saveBtn" class="save_btn__bzc5B" onclick="doSave()">저장 <span
    class="count__abc" id="saveCount" hidden>1</span></button>
  <!-- 발행 버튼은 assert_not_publish 가 막아야 한다. 눌리면 테스트 실패다. -->
  <button id="publishBtn" onclick="doPublish()">발행</button>
</div>

<div class="se-main-container">
  <div class="se-section-documentTitle se-documentTitle">
    <div class="se-text-paragraph" contenteditable="true" data-role="title"></div>
  </div>

  <div class="toolbar">
    <button class="se-image-toolbar-button" onclick="pickImage()">사진</button>
  </div>

  <div class="se-content">
    <div class="se-component-content">
      <div class="se-text-paragraph" contenteditable="true" data-role="body"></div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden onchange="onFile(event)">
<div id="toast" hidden class="se-toast">저장되었습니다</div>

<script>
  let saves = 0;
  window.__events = [];          // 테스트 하네스가 읽는 이벤트 로그
  function rec(kind, detail) { window.__events.push({ kind, detail, at: Date.now() }); }

  function closePopup() {
    document.getElementById('popup').remove();
    rec('popup_dismissed', null);
  }

  function pickImage() { document.getElementById('fileInput').click(); }

  function onFile(e) {
    const f = e.target.files[0];
    if (!f) return;
    const img = document.createElement('img');
    img.className = 'se-image';
    img.alt = f.name;
    img.src = URL.createObjectURL(f);
    // 캐럿 위치에 넣는 대신 본문 끝에 붙인다 (순서 검증에는 충분하다)
    document.querySelector('.se-component-content').appendChild(img);
    rec('image_uploaded', { name: f.name, size: f.size });
    e.target.value = '';
  }

  function doSave() {
    saves += 1;
    const c = document.getElementById('saveCount');
    c.hidden = false; c.textContent = String(saves);
    const t = document.getElementById('toast');
    t.hidden = false; t.textContent = '저장되었습니다';
    rec('saved', { n: saves });
  }

  function doPublish() {
    rec('PUBLISHED', null);      // 이게 찍히면 안전장치가 뚫린 것이다
    alert('발행됨 — 테스트 실패');
  }
</script>
</html>
