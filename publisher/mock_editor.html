<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>가짜 SmartEditor (발행기 자체 테스트용)</title>
<!--
  네이버 SmartEditor ONE 의 구조만 흉내낸 페이지.

  실물 네이버에 붙기 전에 발행기의 **메커니즘**을 검증하는 용도다:
    - #mainFrame iframe 진입
    - 시작 팝업 닫기
    - 제목 입력
    - 클립보드 text/html 붙여넣기로 서식이 살아남는가
    - 사진 버튼 -> 파일 선택기 -> 업로드 후 .se-image 증가
    - 블록 순서 (텍스트 -> 이미지 -> 텍스트)
    - '저장' 은 눌리고 '발행' 은 assert_not_publish 가 막는가

  셀렉터 이름은 naver_selectors.py 의 후보와 맞춰 두었지만, **실제 네이버 DOM 이
  이렇다는 보장은 없다.** 실물 셀렉터는 --keep-open 으로 직접 확인해야 한다.

  사용:
    python -m http.server 8899 --directory publisher
    (config 의 write_url 을 http://localhost:8899/mock_editor.html 로)
-->
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; }
  iframe { width: 100%; height: 100vh; border: 0; }
</style>
<iframe id="mainFrame" src="mock_editor_inner.html"></iframe>
</html>
